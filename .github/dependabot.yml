# Dependabot config.
# Keep NPM and Composer packages up-to-date.
# Let's start out with weekly updates and then drop back to less frequent intervals after everything is up-to-date.

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    # Look for `package.json` and `lock` files in the `root` directory
    directory: '/'
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: 'weekly'
    # Add reviewers
    reviewers:
      - 'Automattic/newspack-product'
    # Group minor and patch updates by ecosystem to reduce PR volume.
    # Major updates are intentionally left ungrouped so each one gets its own
    # PR for proper review (e.g. eslint 8 → 9 needs careful handling).
    groups:
      wordpress:
        patterns:
          - '@wordpress/*'
        update-types:
          - 'minor'
          - 'patch'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - '@rushstack/eslint-patch'
        update-types:
          - 'minor'
          - 'patch'
      testing:
        patterns:
          - '@testing-library/*'
        update-types:
          - 'minor'
          - 'patch'
      semantic-release:
        patterns:
          - 'semantic-release'
          - 'semantic-release-*'
          - '@semantic-release/*'
        update-types:
          - 'minor'
          - 'patch'
      commitlint:
        patterns:
          - '@commitlint/*'
          - 'commitizen'
          - 'cz-conventional-changelog'
        update-types:
          - 'minor'
          - 'patch'
      types:
        patterns:
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'

  # Enable version updates for Composer
  - package-ecosystem: 'composer'
    # Look for a `composer.lock` in the `root` directory
    directory: '/'
    # Check for updates every day (weekdays)
    schedule:
      interval: 'weekly'
    # Add reviewers
    reviewers:
      - 'Automattic/newspack-product'
